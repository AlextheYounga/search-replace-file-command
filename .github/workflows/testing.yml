name: Testing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron:  '17 1 * * *' # Run every day on a seemly random time.

jobs:
  test:
    uses: wp-cli/.github/.github/workflows/reusable-testing.yml@main
    with:
      matrix: >-
        {
          "include": [
            { "php": "7.2", "wp": "4.9", "dbtype": "sqlite" }
          ],
          "exclude": [
            { "mysql": "mysql-5.6" },
            { "mysql": "mysql-5.7" },
            { "mysql": "mysql-8.0" },
            { "mysql": "mysql-8.4" },
            { "mysql": "mariadb-11.4" }
          ]
        }
